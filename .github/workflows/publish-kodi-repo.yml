name: Build and publish Kodi repository

on:
  push:
    branches: [main]
    paths-ignore: ["repo/**", "repository.curatr-*.zip"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kodi-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build repository
        run: python3 tools/build_repo.py
      - name: Commit generated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build Kodi repository"
          git pull --rebase origin main
          git push
